name: DS Engine CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  engine-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Core ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch transformers captum librosa numpy
      - name: Run Engine Tests
        run: pytest
